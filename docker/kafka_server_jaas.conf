// JAAS configuration for the integration-test broker in docker-compose.yml.
//
// Throwaway credentials, not a configuration example: the broker is a local
// single-node container and these passwords are public.
//
// A file is used instead of the image's KAFKA_LISTENER_NAME_*_SASL_JAAS_CONFIG
// variables because their env-var-to-property mapping lowercases the key and
// turns every underscore into a dot, which cannot spell a listener named
// SASL_PLAINTEXT ("listener.name.sasl.plaintext...") or a mechanism named
// SCRAM-SHA-256 ("...scram.sha.256..."). A JAAS file selects the module by
// class name at run time, so the dashed mechanism names survive.
sasl_plaintext.KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
    user_admin="admin-secret"
    user_client="client-secret";
  org.apache.kafka.common.security.scram.ScramLoginModule required;
};

// The SASL_SSL listener enables PLAIN only (see KAFKA_OPTS in
// docker-compose.yml); the users are duplicated here because a JAAS file
// selects the module per listener at run time.
sasl_ssl.KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
    user_admin="admin-secret"
    user_client="client-secret";
};
