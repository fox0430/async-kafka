# Single-broker KRaft cluster for the integration tests
# (`nimble test_integration`). Three client listeners are exposed:
#
#   9092 PLAINTEXT       — everything except the SASL suites
#   9094 SASL_PLAINTEXT  — PLAIN / SCRAM-SHA-256 / SCRAM-SHA-512
#   9095 SASL_SSL        — PLAIN over TLS (certgen below owns the certificate)
#
# The SASL_SSL listener advertises `localhost`, not `127.0.0.1`: BearSSL checks
# a DNS name against the certificate's dNSName SANs, so an IP-literal host
# cannot complete verification (the certificate carries both SANs, but only the
# name one is usable).
#
# The credentials below are throwaway values for this local broker; they are
# not a configuration example. SCRAM users are not declared here: they live in
# the KRaft metadata log and are written by `kafka-configs.sh` after startup
services:
  certgen:
    # Generates docker/certs (git-ignored) for the SASL_SSL listener. A separate
    # service rather than a repository-committed key: the material stays a local
    # artifact, and CI and a developer machine run the same generation step.
    image: alpine:3.20
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache openssl >/dev/null && exec sh /certs/generate-certs.sh
    volumes:
      - ./docker/generate-certs.sh:/certs/generate-certs.sh:ro
      - ./docker/certs:/certs/out
    restart: "no"

  kafka:
    image: apache/kafka:3.7.0
    depends_on:
      certgen:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
      - "9094:9094"
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SASL_PLAINTEXT://0.0.0.0:9094,SASL_SSL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,SASL_PLAINTEXT://127.0.0.1:9094,SASL_SSL://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # All three mechanisms share the SASL_PLAINTEXT listener. Their modules
      # live in docker/kafka_server_jaas.conf — the image's env-var mapping
      # cannot spell the listener name or the dashed mechanism names (see that
      # file).
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      # The SASL_SSL listener offers PLAIN only. `KAFKA_OPTS` rather than an env
      # var for the same reason as the JAAS file: the env-var mapping would turn
      # SASL_SSL into "sasl.ssl" and name a listener that does not exist.
      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
        -Dlistener.name.sasl_ssl.sasl.enabled.mechanisms=PLAIN
      # The image's configure script rewrites KAFKA_SSL_KEYSTORE_LOCATION from
      # the FILENAME below and reads both passwords from the *_CREDENTIALS
      # files, so only names relative to /etc/kafka/secrets are settable here.
      # The certs bind mount sits one level down, hence the `certs/` prefix.
      KAFKA_SSL_KEYSTORE_FILENAME: certs/server.p12
      KAFKA_SSL_KEY_CREDENTIALS: certs/key_password
      KAFKA_SSL_KEYSTORE_CREDENTIALS: certs/keystore_password
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./docker/kafka_server_jaas.conf:/etc/kafka/secrets/kafka_server_jaas.conf:ro
      - ./docker/certs:/etc/kafka/secrets/certs:ro
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
